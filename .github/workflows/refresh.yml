name: Refresh SAT dashboard

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *"
    - cron: "23 9 * * *"
    - cron: "47 13 * * *"
    - cron: "33 18 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-sat
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Refresh cache from Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER:     ${{ secrets.JIRA_USER }}
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
        run: |
          if [ -f cache/jira_status_timeline.json ]; then
            python scripts/fetch_jira.py --cache cache/jira_status_timeline.json --mode update
          else
            python scripts/fetch_jira.py --cache cache/jira_status_timeline.json --mode seed
          fi

      - name: Refresh Airtable Pedidos
        continue-on-error: true
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          python scripts/fetch_airtable.py --cache cache/airtable_pedidos.json

      - name: Refresh Airtable Inmovilizado
        continue-on-error: true
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          python scripts/fetch_inmovilizado.py --cache cache/airtable_inmovilizado.json

      - name: Refresh Jira sustituciones activas
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER:     ${{ secrets.JIRA_USER }}
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
        run: |
          python scripts/fetch_sustis.py --cache cache/sustis_activas.json

      - name: Refresh Jira sustituciones historico (activas + cerradas 2026)
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER:     ${{ secrets.JIRA_USER }}
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
        run: |
          python scripts/fetch_sustis_history.py --cache cache/sustis_historico.json

      - name: Enrich presupuesto desde Holded (para tickets sin PDF en attachments)
        continue-on-error: true
        env:
          HOLDED_API_KEY: ${{ secrets.HOLDED_API_KEY }}
        run: |
          python scripts/enrich_from_holded.py --cache cache/jira_status_timeline.json

      - name: Enrich factura desde Holded (cruce ppto -> invoice + cobrado/pendiente/estado)
        continue-on-error: true
        env:
          HOLDED_API_KEY: ${{ secrets.HOLDED_API_KEY }}
        run: |
          python scripts/enrich_invoices_from_holded.py --cache cache/jira_status_timeline.json

      - name: Geocode addresses (Nominatim) for mapa
        continue-on-error: true
        run: |
          python scripts/geocode.py

      - name: Build report
        run: |
          mkdir -p output
          python scripts/build_report.py \
            --cache cache/jira_status_timeline.json \
            --output-xlsx output/Evolucion_SAT.xlsx \
            --output-html output/index.html

      - name: Commit cache + output back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/ output/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh SAT cache + report ($(date -u +%Y-%m-%d))"
            # Reintenta el push hasta 5 veces con pull --rebase intermedio
            # (evita race condition con commits manuales).
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push OK en intento $i"
                exit 0
              fi
              echo "Push falló (intento $i). Rebase y reintentar..."
              # Si hay conflicto en output/index.html o caches, prevalecer la versión nueva del bot
              git pull --rebase -X theirs --autostash || {
                # Si rebase falla, abortar y salir
                git rebase --abort 2>/dev/null
                exit 1
              }
            done
            echo "Falló el push tras 5 reintentos."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
